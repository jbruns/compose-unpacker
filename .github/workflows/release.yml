name: Release

on:
  push:
    branches: [main]
    paths:
      - versions.json
      - overlay/**
      - patches/**
      - Dockerfile
      - Makefile
      - scripts/**
      - cmd/fetch-sops/**
      - cmd/manifest-value/**
      - cmd/prepare/**
      - internal/fetch/**
      - internal/manifest/**
      - internal/prepare/**
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Require main branch
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "releases are restricted to refs/heads/main (got $GITHUB_REF)" >&2
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Derive release metadata
        id: release
        env:
          IMAGE_REPOSITORY: ghcr.io/jbruns/compose-unpacker
        run: |
          set -euo pipefail
          manifest_value() {
            go run ./cmd/manifest-value -manifest versions.json "$1"
          }

          release_tags=$(go run ./cmd/manifest-value \
            -manifest versions.json \
            -repository "$IMAGE_REPOSITORY" \
            release-tags)
          immutable=$(printf '%s\n' "$release_tags" | sed -n '1p')
          version=$(printf '%s\n' "$release_tags" | sed -n '2p')
          lts=$(printf '%s\n' "$release_tags" | sed -n '3p')
          extra=$(printf '%s\n' "$release_tags" | sed -n '4p')
          if [[ -z "$immutable" || -z "$version" || -z "$lts" || -n "$extra" ]]; then
            echo "manifest returned an invalid release tag set" >&2
            exit 1
          fi
          go_version=$(manifest_value go-version)
          base_image=$(manifest_value base-image)
          base_digest=$(manifest_value base-digest)
          portainer_version=$(manifest_value portainer-version)
          compose_unpacker_commit=$(manifest_value compose-unpacker-commit)
          portainer_server_commit=$(manifest_value portainer-server-commit)
          sops_version=$(manifest_value sops-version)
          overlay_revision=$(manifest_value overlay-revision)
          build_created=$(git show -s --format=%cI "$GITHUB_SHA")
          candidate="${IMAGE_REPOSITORY}:prepublish-${GITHUB_SHA}"

          {
            echo "immutable=$immutable"
            echo "version=$version"
            echo "lts=$lts"
            echo "candidate=$candidate"
            echo "go-version=$go_version"
            echo "base-image=$base_image"
            echo "base-digest=$base_digest"
            echo "portainer-version=$portainer_version"
            echo "compose-unpacker-commit=$compose_unpacker_commit"
            echo "portainer-server-commit=$portainer_server_commit"
            echo "sops-version=$sops_version"
            echo "overlay-revision=$overlay_revision"
            echo "build-created=$build_created"
          } >>"$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject existing immutable tag
        env:
          IMMUTABLE_TAG: ${{ steps.release.outputs.immutable }}
        run: |
          set -euo pipefail
          if inspect_error=$(docker buildx imagetools inspect "$IMMUTABLE_TAG" 2>&1); then
            echo "immutable tag already exists: $IMMUTABLE_TAG" >&2
            exit 1
          fi
          case "$inspect_error" in
            "$IMMUTABLE_TAG: not found" | \
              "ERROR: $IMMUTABLE_TAG: not found" | \
              "$IMMUTABLE_TAG: manifest unknown" | \
              "ERROR: $IMMUTABLE_TAG: manifest unknown" | \
              "manifest unknown: $IMMUTABLE_TAG" | \
              "ERROR: manifest unknown: $IMMUTABLE_TAG") ;;
            *)
              echo "could not prove immutable tag is absent: $IMMUTABLE_TAG" >&2
              printf '%s\n' "$inspect_error" >&2
              exit 1
              ;;
          esac
      - name: Prepare candidate inputs
        run: |
          make --no-print-directory prepare
          make --no-print-directory validate-fetch-sops
      - name: Build candidate artifact
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.candidate }}
          sbom: true
          provenance: mode=max
          build-args: |
            GO_VERSION=${{ steps.release.outputs.go-version }}
            BASE_IMAGE=${{ steps.release.outputs.base-image }}
            BASE_DIGEST=${{ steps.release.outputs.base-digest }}
            PORTAINER_VERSION=${{ steps.release.outputs.portainer-version }}
            SOPS_VERSION=${{ steps.release.outputs.sops-version }}
            OVERLAY_REVISION=${{ steps.release.outputs.overlay-revision }}
            COMPOSE_UNPACKER_COMMIT=${{ steps.release.outputs.compose-unpacker-commit }}
            PORTAINER_SERVER_COMMIT=${{ steps.release.outputs.portainer-server-commit }}
            SOURCE_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ steps.release.outputs.build-created }}
      - name: Validate candidate artifact
        run: scripts/validate.sh --existing-image "$CANDIDATE_REFERENCE"
        env:
          CANDIDATE_REFERENCE: ${{ steps.release.outputs.candidate }}@${{ steps.build.outputs.digest }}
      - name: Promote validated artifact
        env:
          CANDIDATE_REFERENCE: ${{ steps.release.outputs.candidate }}@${{ steps.build.outputs.digest }}
          VALIDATED_DIGEST: ${{ steps.build.outputs.digest }}
          IMMUTABLE_TAG: ${{ steps.release.outputs.immutable }}
          VERSION_TAG: ${{ steps.release.outputs.version }}
          LTS_TAG: ${{ steps.release.outputs.lts }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMMUTABLE_TAG" \
            --tag "$VERSION_TAG" \
            --tag "$LTS_TAG" \
            "$CANDIDATE_REFERENCE"
          for tag in "$IMMUTABLE_TAG" "$VERSION_TAG" "$LTS_TAG"; do
            promoted_digest=$(docker buildx imagetools inspect \
              "$tag" \
              --format '{{.Manifest.Digest}}')
            if [[ "$promoted_digest" != "$VALIDATED_DIGEST" ]]; then
              echo "$tag does not reference validated digest $VALIDATED_DIGEST (found $promoted_digest)" >&2
              exit 1
            fi
          done
      - name: Attest immutable image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/jbruns/compose-unpacker
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summarize release
        env:
          IMMUTABLE_TAG: ${{ steps.release.outputs.immutable }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Published image"
            echo
            echo "\`$IMMUTABLE_TAG@$DIGEST\`"
          } >>"$GITHUB_STEP_SUMMARY"
